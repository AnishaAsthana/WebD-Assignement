<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <legend>Personal Details</legend>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name">
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <br><br>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" id="Password" placeholder="Enter your password" required>
        <br><br>
        <label for="Gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="Male" required> <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="Female" required> <label for="female">Female</label>
        <br><br>
        <label for="hobbies">Hobbies:</label>
        <input type="checkbox" id="reading" name="hobby1" value="Reading"> <label for="reading">Reading</label>
        <input type="checkbox" id="coding" name="hobby2" value="Coding"> <label for="coding">Coding</label> 
        <br><br>
        <label for="DOB">Date of Birth:</label>
        <input type="date" id="DOB" name="DOB">
        <br><br>
    </fieldset>
</body>
</html>
